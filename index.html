<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CO₂ Emissions Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #f8f9fa;
        padding: 25px;
        color: #1e293b;
      }
      .container {
        max-width: 1800px;
        margin: 0 auto;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .header h1 {
        font-size: 2.2em;
        color: #1e293b;
        margin-bottom: 5px;
        font-weight: 700;
      }
      .header p {
        color: #64748b;
        font-size: 1em;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
      }

      .card-header {
        font-size: 1.3em;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f1f5f9;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .chart-section {
        display: flex;
        flex-direction: column;
      }

      #lineChart {
        width: 100%;
        height: 400px;
        margin-bottom: 0;
      }

      .year-control-wrapper {
        margin-top: 25px;
        padding: 0 70px;
      }

      .year-info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 12px;
      }

      .year-label {
        font-size: 0.9em;
        font-weight: 600;
        color: #64748b;
      }

      .year-display {
        font-size: 1.8em;
        font-weight: 700;
        color: #3b82f6;
        min-width: 80px;
        text-align: center;
      }

      #yearSlider {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        outline: none;
        -webkit-appearance: none;
        cursor: pointer;
        background: #e2e8f0;
        margin-bottom: 8px;
      }
      #yearSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #3b82f6;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
      }
      #yearSlider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #3b82f6;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
      }

      .year-marks {
        display: flex;
        justify-content: space-between;
        font-size: 0.7em;
        color: #94a3b8;
        font-weight: 600;
      }

      #worldMap {
        width: 100%;
        height: 575px;
      }

      .country-details {
        animation: slideIn 0.3s ease-out;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .country-header-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .country-title-section h2 {
        font-size: 1.8em;
        color: #1e293b;
        font-weight: 700;
      }
      .country-title-section p {
        color: #64748b;
        font-size: 0.95em;
        margin-top: 4px;
      }
      .close-btn {
        padding: 8px 14px;
        background: #f1f5f9;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1em;
        font-weight: 600;
        color: #64748b;
        transition: all 0.2s;
      }
      .close-btn:hover {
        background: #e2e8f0;
        transform: scale(1.05);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 25px;
      }
      .metric-card {
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }
      .metric-card.blue {
        background: #eff6ff;
        border-left: 4px solid #3b82f6;
      }
      .metric-card.red {
        background: #fef2f2;
        border-left: 4px solid #ef4444;
      }
      .metric-card.purple {
        background: #faf5ff;
        border-left: 4px solid #a855f7;
      }
      .metric-label {
        font-size: 0.8em;
        color: #64748b;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .metric-value {
        font-size: 1.8em;
        font-weight: 700;
        color: #1e293b;
      }
      .metric-unit {
        font-size: 0.5em;
        color: #64748b;
        font-weight: 600;
      }

      .sector-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .sector-bars {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sector-row {
        display: grid;
        grid-template-columns: 110px 1fr auto;
        align-items: center;
        gap: 12px;
      }
      .sector-name {
        font-size: 0.85em;
        font-weight: 600;
        color: #475569;
      }
      .sector-bar-bg {
        height: 24px;
        background: #f1f5f9;
        border-radius: 12px;
        overflow: hidden;
      }
      .sector-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #f87171, #dc2626);
        border-radius: 12px;
        transition: width 0.5s ease;
      }
      .sector-value {
        font-size: 0.8em;
        font-weight: 700;
        color: #1e293b;
        white-space: nowrap;
      }

      .spinner {
        border: 4px solid #e2e8f0;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🌍 Global Greenhouse Gas Emissions Dashboard</h1>
        <p>Emissions across countries, regions & sectors • 1990-2023</p>
      </div>

      <div id="loading" class="card" style="text-align: center; padding: 60px">
        <div class="spinner"></div>
        <p style="color: #64748b; font-weight: 600">
          Loading emissions data...
        </p>
      </div>

      <div id="mainContent" style="display: none">
        <div class="main-grid">
          <div class="card chart-section">
            <div class="card-header">Global Emissions Trend</div>
            <div id="lineChart"></div>
            <div class="year-control-wrapper">
              <div class="year-info">
                <span class="year-label">Selected Year:</span>
                <div class="year-display" id="currentYear">2023</div>
              </div>
              <input
                type="range"
                id="yearSlider"
                min="1990"
                max="2023"
                value="2023"
                step="1"
              />
              <div class="year-marks" id="yearMarks"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">Emissions Per Capita Map</div>
            <div id="worldMap"></div>
          </div>
        </div>

        <div class="card" id="countryDetails" style="display: none"></div>
      </div>
    </div>

    <script>
      let allData = [],
        sectorData = [],
        selectedCountry = null,
        selectedContinent = null,
        currentYear = 2023,
        yearRange = { min: 1990, max: 2023 };

      async function init() {
        try {
          const mainResponse = await fetch(
            "data/greenhouse_gas_with_population.csv"
          );
          const sectorResponse = await fetch(
            "data/greenhouse_gas_per_sector.csv"
          );
          allData = Papa.parse(await mainResponse.text(), {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
          }).data;
          sectorData = Papa.parse(await sectorResponse.text(), {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
          }).data;
          allData = allData.filter(
            (row) =>
              row.year &&
              row.iso_code &&
              row.emissions_per_capita &&
              row.emissions
          );

          allData.forEach((row) => {
            const yearData = allData.filter((d) => d.year === row.year);
            const values = yearData
              .map((d) => d.emissions_per_capita)
              .sort((a, b) => a - b);
            row.emissions_percentile =
              (values.filter((v) => v <= row.emissions_per_capita).length /
                values.length) *
              100;
          });

          const years = [...new Set(allData.map((d) => d.year))].sort(
            (a, b) => a - b
          );
          yearRange = { min: years[0], max: years[years.length - 1] };
          currentYear = yearRange.max;

          setupSlider();
          createLineChart();
          createWorldMap();

          document.getElementById("loading").style.display = "none";
          document.getElementById("mainContent").style.display = "block";
        } catch (error) {
          document.getElementById("loading").innerHTML =
            '<div style="color: #dc2626; padding: 30px;"><h3>Error Loading Data</h3><p>' +
            error.message +
            "</p></div>";
        }
      }

      function setupSlider() {
        const slider = document.getElementById("yearSlider");
        slider.min = yearRange.min;
        slider.max = yearRange.max;
        slider.value = currentYear;
        document.getElementById("currentYear").textContent = currentYear;

        const marksContainer = document.getElementById("yearMarks");
        const totalYears = yearRange.max - yearRange.min + 1;
        const showEvery = totalYears > 20 ? 5 : 2;

        for (let y = yearRange.min; y <= yearRange.max; y++) {
          if ((y - yearRange.min) % showEvery === 0 || y === yearRange.max) {
            const mark = document.createElement("span");
            mark.textContent = y;
            marksContainer.appendChild(mark);
          }
        }

        slider.addEventListener("input", (e) => {
          currentYear = parseInt(e.target.value);
          document.getElementById("currentYear").textContent = currentYear;
          updateWorldMap();
          updateLineChartMarker();
          if (selectedCountry) updateCountryDetails();
        });
      }

      function calculateGlobalTrend() {
        const yg = {};
        allData.forEach((row) => {
          if (!yg[row.year]) yg[row.year] = 0;
          yg[row.year] += row.emissions;
        });
        return Object.entries(yg)
          .map(([year, emissions]) => ({
            year: parseInt(year),
            emissions,
            temperature: Math.min(2.5, (emissions / 35000) * 1.5),
          }))
          .sort((a, b) => a.year - b.year);
      }

      function calculateContinentTrend(continent) {
        const yg = {};
        allData
          .filter((row) => row.continent === continent)
          .forEach((row) => {
            if (!yg[row.year]) yg[row.year] = 0;
            yg[row.year] += row.emissions;
          });
        return Object.entries(yg)
          .map(([year, emissions]) => ({
            year: parseInt(year),
            emissions,
          }))
          .sort((a, b) => a.year - b.year);
      }

      function createLineChart() {
        const gt = calculateGlobalTrend();
        const maxE = Math.max(...gt.map((d) => d.emissions));

        const milestones = [
          { year: 2015, label: "Paris" },
          { year: 2018, label: "COP24" },
          { year: 2023, label: "COP28" },
        ];

        const traces = [
          {
            x: gt.map((d) => d.year),
            y: gt.map((d) => d.emissions),
            type: "scatter",
            mode: "lines",
            name: "Global",
            line: { color: "#3b82f6", width: 3 },
            yaxis: "y",
          },
          {
            x: gt.map((d) => d.year),
            y: gt.map((d) => d.temperature),
            type: "scatter",
            mode: "lines",
            name: "Temp",
            line: { color: "#ef4444", width: 2, dash: "dot" },
            yaxis: "y2",
          },
        ];

        milestones.forEach((m) => {
          traces.push({
            x: [m.year, m.year],
            y: [0, maxE * 0.95],
            type: "scatter",
            mode: "lines",
            name: m.label,
            line: { color: "#f59e0b", width: 1, dash: "dot" },
            showlegend: false,
            hovertemplate: "<b>" + m.label + "</b><extra></extra>",
          });
        });

        traces.push({
          x: [currentYear, currentYear],
          y: [0, maxE * 0.95],
          type: "scatter",
          mode: "lines",
          name: "Selected",
          line: { color: "#dc2626", width: 2.5, dash: "dash" },
          showlegend: false,
        });

        const layout = {
          xaxis: {
            title: "",
            showgrid: true,
            gridcolor: "#f1f5f9",
            range: [yearRange.min - 1, yearRange.max + 1],
            tickfont: { size: 10 },
          },
          yaxis: {
            title: {
              text: "Emissions (MtCO₂e)",
              font: { size: 11, color: "#3b82f6" },
            },
            showgrid: true,
            gridcolor: "#f1f5f9",
            tickfont: { color: "#3b82f6", size: 9 },
          },
          yaxis2: {
            title: { text: "Temp (°C)", font: { size: 11, color: "#ef4444" } },
            overlaying: "y",
            side: "right",
            range: [0, 2.5],
            tickfont: { color: "#ef4444", size: 9 },
          },
          shapes: [
            {
              type: "line",
              x0: yearRange.min,
              x1: yearRange.max,
              y0: 1.5,
              y1: 1.5,
              yref: "y2",
              line: { color: "#10b981", width: 2, dash: "dash" },
            },
            {
              type: "line",
              x0: yearRange.min,
              x1: yearRange.max,
              y0: 2.0,
              y1: 2.0,
              yref: "y2",
              line: { color: "#f59e0b", width: 2, dash: "dash" },
            },
          ],
          annotations: [
            {
              x: yearRange.max,
              y: 1.5,
              yref: "y2",
              text: "1.5°C",
              showarrow: false,
              xanchor: "left",
              xshift: 5,
              font: { color: "#10b981", size: 10 },
            },
            {
              x: yearRange.max,
              y: 2.0,
              yref: "y2",
              text: "2.0°C",
              showarrow: false,
              xanchor: "left",
              xshift: 5,
              font: { color: "#f59e0b", size: 10 },
            },
          ],
          margin: { l: 70, r: 70, t: 10, b: 40 },
          paper_bgcolor: "rgba(0,0,0,0)",
          plot_bgcolor: "#fafafa",
          legend: {
            x: 0.02,
            y: 0.98,
            bgcolor: "rgba(255,255,255,0.9)",
            font: { size: 10 },
            bordercolor: "#e2e8f0",
            borderwidth: 1,
          },
          hovermode: "x unified",
        };

        Plotly.newPlot("lineChart", traces, layout, {
          responsive: true,
          displayModeBar: false,
        });
      }

      function createWorldMap() {
        const cyd = allData.filter((row) => row.year === currentYear);

        const trace = {
          type: "choropleth",
          locations: cyd.map((d) => d.iso_code),
          z: cyd.map((d) => d.emissions_percentile),
          text: cyd.map((d) => d.Name),
          customdata: cyd.map((d) => [
            d.emissions_per_capita,
            d.iso_code,
            d.emissions_percentile,
          ]),
          hovertemplate:
            "<b>%{text}</b><br>" +
            "<b>%{customdata[0]:.2f} tCO₂e</b> per capita<br>" +
            "Percentile: %{customdata[2]:.0f}%<extra></extra>",
          colorscale: [
            [0, "#fef2f2"],
            [0.15, "#fee2e2"],
            [0.3, "#fecaca"],
            [0.5, "#fca5a5"],
            [0.7, "#f87171"],
            [0.85, "#ef4444"],
            [1, "#dc2626"],
          ],
          zmin: 0,
          zmax: 100,
          colorbar: {
            title: { text: "Emission<br>Percentile", font: { size: 10 } },
            thickness: 15,
            len: 0.7,
            ticksuffix: "%",
            tickfont: { size: 9 },
          },
          marker: { line: { color: "rgba(255,255,255,0.6)", width: 0.5 } },
        };

        const layout = {
          geo: {
            projection: { type: "natural earth" },
            showcoastlines: false,
            showland: true,
            landcolor: "#f8fafc",
            showocean: true,
            oceancolor: "#dbeafe",
            showcountries: true,
            countrycolor: "rgba(255,255,255,0.4)",
            bgcolor: "rgba(0,0,0,0)",
            showframe: false,
          },
          margin: { l: 0, r: 0, t: 0, b: 0 },
          paper_bgcolor: "rgba(0,0,0,0)",
          height: 575,
          dragmode: false,
        };

        Plotly.newPlot("worldMap", [trace], layout, {
          responsive: true,
          displayModeBar: false,
          scrollZoom: false,
        });

        document.getElementById("worldMap").on("plotly_click", function (data) {
          if (data.points && data.points.length > 0) {
            const iso = data.points[0].customdata[1];
            const cd = allData
              .filter((row) => row.year === currentYear)
              .find((d) => d.iso_code === iso);
            if (cd) selectCountry(iso, cd.continent);
          }
        });
      }

      function updateWorldMap() {
        const cyd = allData.filter((row) => row.year === currentYear);
        Plotly.update(
          "worldMap",
          {
            locations: [cyd.map((d) => d.iso_code)],
            z: [cyd.map((d) => d.emissions_percentile)],
            text: [cyd.map((d) => d.Name)],
            customdata: [
              cyd.map((d) => [
                d.emissions_per_capita,
                d.iso_code,
                d.emissions_percentile,
              ]),
            ],
          },
          {},
          [0]
        );
      }

      function updateLineChartMarker() {
        const gt = calculateGlobalTrend();
        const maxE = Math.max(...gt.map((d) => d.emissions));
        const ti = selectedContinent
          ? document.getElementById("lineChart").data.length - 2
          : document.getElementById("lineChart").data.length - 1;
        Plotly.update(
          "lineChart",
          { x: [[currentYear, currentYear]], y: [[0, maxE * 0.95]] },
          {},
          [ti]
        );
      }

      function updateContinentLine() {
        const et = document.getElementById("lineChart").data;
        const cti = et.findIndex((t) => t.line && t.line.color === "#a855f7");
        if (cti !== -1) Plotly.deleteTraces("lineChart", cti);

        if (selectedContinent) {
          const ct = calculateContinentTrend(selectedContinent);
          Plotly.addTraces("lineChart", {
            x: ct.map((d) => d.year),
            y: ct.map((d) => d.emissions),
            type: "scatter",
            mode: "lines",
            name: selectedContinent,
            line: { color: "#a855f7", width: 2.5 },
            yaxis: "y",
          });
        }
      }

      function selectCountry(iso, continent) {
        selectedCountry = iso;
        selectedContinent = continent;
        updateContinentLine();
        updateCountryDetails();
      }

      function clearCountrySelection() {
        selectedCountry = null;
        selectedContinent = null;
        updateContinentLine();
        document.getElementById("countryDetails").style.display = "none";
      }

      function updateCountryDetails() {
        const cd = allData.find(
          (d) => d.iso_code === selectedCountry && d.year === currentYear
        );
        if (!cd) return;

        const cs = {};
        sectorData
          .filter(
            (row) =>
              row.iso_code === selectedCountry && row.year === currentYear
          )
          .forEach((row) => {
            if (!cs[row.sector]) cs[row.sector] = 0;
            cs[row.sector] += row.emissions;
          });
        const sectors = Object.entries(cs)
          .map(([sector, emissions]) => ({ sector, emissions }))
          .sort((a, b) => b.emissions - a.emissions);

        let sectorHTML = "";
        if (sectors.length > 0) {
          const maxSE = Math.max(...sectors.map((s) => s.emissions));
          const half = Math.ceil(sectors.length / 2);
          const col1 = sectors.slice(0, half);
          const col2 = sectors.slice(half);

          sectorHTML =
            '<div class="card-header">Sector Breakdown (' +
            currentYear +
            ')</div><div class="sector-grid">';
          [col1, col2].forEach((col) => {
            sectorHTML += '<div class="sector-bars">';
            col.forEach((s) => {
              const pct = (s.emissions / maxSE) * 100;
              sectorHTML +=
                '<div class="sector-row"><div class="sector-name">' +
                s.sector +
                '</div><div class="sector-bar-bg"><div class="sector-bar-fill" style="width: ' +
                pct +
                '%"></div></div><div class="sector-value">' +
                s.emissions.toFixed(1) +
                " Mt</div></div>";
            });
            sectorHTML += "</div>";
          });
          sectorHTML += "</div>";
        }

        const html =
          '<div class="country-header-section"><div class="country-title-section"><h2>' +
          cd.Name +
          "</h2><p>" +
          (cd.continent || "Unknown") +
          " • " +
          cd.emissions_percentile.toFixed(0) +
          'th percentile</p></div><button class="close-btn" onclick="clearCountrySelection()">✕ Close</button></div><div class="metrics"><div class="metric-card blue"><div class="metric-label">Year</div><div class="metric-value">' +
          currentYear +
          '</div></div><div class="metric-card red"><div class="metric-label">Per Capita</div><div class="metric-value">' +
          cd.emissions_per_capita.toFixed(2) +
          ' <span class="metric-unit">tCO₂e</span></div></div><div class="metric-card purple"><div class="metric-label">Total</div><div class="metric-value">' +
          cd.emissions.toFixed(0) +
          ' <span class="metric-unit">Mt</span></div></div></div>' +
          sectorHTML;

        document.getElementById("countryDetails").innerHTML = html;
        document.getElementById("countryDetails").style.display = "block";
      }

      init();
    </script>
  </body>
</html>
